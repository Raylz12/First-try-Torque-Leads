<script>
// Run immediately — before React — so localStorage is seeded at render time
(function() {
  var K = 'uptime_auth_v1';
  var user = '';
  try { user = sessionStorage.getItem(K) || ''; } catch(e) {}
  if (!user) return;

  // ── Seed Fullbay localStorage config BEFORE React renders ──
  try {
    localStorage.setItem('uptimeFullbayProxy', '/api/fullbay');
    if (!localStorage.getItem('uptimeFullbayServerIp')) {
      localStorage.setItem('uptimeFullbayServerIp', '32.196.231.106');
    }
    if (!localStorage.getItem('uptimeFullbayKey')) {
      localStorage.setItem('uptimeFullbayKey', 'faf7e049-5dad-fa59-6e70-6117d3f8ae5f');
    }
  } catch(e) {}

  // ── Show nav immediately (it's in the DOM now) ──
  var nav = document.getElementById('tl-nav');
  if (nav) nav.style.display = 'flex';

  // ── Show admin link ──
  if (user === 'rhett' || user === 'admin') {
    var ab = document.getElementById('tl-admin-btn');
    var as = document.getElementById('tl-admin-sep');
    if (ab) ab.style.display = 'flex';
    if (as) as.style.display = 'block';
  }

  // ── Wire sign-out button ──
  var so = document.getElementById('tl-signout');
  if (so) so.onclick = function() {
    try { sessionStorage.removeItem(K); } catch(e) {}
    window.location.href = '/uptime-os/?t=' + Date.now();
  };

  // ── Expose logout globally for the app's own sign-out buttons ──
  window.__TL_Logout = function() {
    try { sessionStorage.removeItem(K); } catch(e) {}
    window.location.href = '/uptime-os/?t=' + Date.now();
  };
})();
</script>

window.__TL_Logout = function() {
  try { sessionStorage.removeItem('uptime_auth_v1'); } catch(e) {}
  window.location.href = window.location.pathname + '?t=' + Date.now();
};
window.addEventListener('load', function() {
  var user = '';
  try { user = sessionStorage.getItem('uptime_auth_v1') || ''; } catch(e) {}
  if (!user) return;
  // Show nav bar
  var nav = document.getElementById('tl-nav');
  if (nav) nav.style.display = 'flex';
  // Clear body bg in case unlock ran before nav was in DOM
  document.body.style.background = '';

  // The app checks all three before making any API call
  try {
    // 1. Proxy URL — always point to our Vercel serverless function
    if (!localStorage.getItem('uptimeFullbayProxy')) {
      localStorage.setItem('uptimeFullbayProxy', '/api/fullbay');
    }
    // 2. Server IP — proxy regenerates the token with its real IP and ignores this,
    //    but the app hard-checks that it's set before even calling the proxy.

    if (!localStorage.getItem('uptimeFullbayServerIp')) {
      localStorage.setItem('uptimeFullbayServerIp', '32.196.231.106');
    }
    // 3. Key — use what was saved in integrations page (uptimeFullbayKey)
    //    If not set yet, Jon's key is the default for this install
    if (!localStorage.getItem('uptimeFullbayKey')) {
      localStorage.setItem('uptimeFullbayKey', 'faf7e049-5dad-fa59-6e70-6117d3f8ae5f');
    }
    // Ensure proxy URL is always correct even if a stale value was stored
    localStorage.setItem('uptimeFullbayProxy', '/api/fullbay');
  } catch(e) {}
  // Show admin links for admins
  if (user === 'rhett' || user === 'admin') {
    var ab = document.getElementById('tl-admin-btn');
    var as_ = document.getElementById('tl-admin-sep');
    if (ab) ab.style.display = 'flex';
    if (as_) as_.style.display = 'block';
  }
  // Wire Fullbay proxy
  var orig = window.AnvilFullbay || {};
  window.AnvilFullbay = Object.assign({}, orig, {
    _proxyUrl: '/api/fullbay',
    getStatus: function() {
      var k=''; try{k=localStorage.getItem('uptimeFullbayKey')||'';}catch(e){}
      return{configured:!!k,lastSync:localStorage.getItem('uptimeFullbayLastSync')||'',key:k};
    },
    getCfg: function() {
      var k=''; try{k=localStorage.getItem('uptimeFullbayKey')||'';}catch(e){}
      return{key:k,auto:parseInt(localStorage.getItem('uptimeFullbayAuto')||'0',10)};
    },
    setCfg: function(o) {
      if(o.key!==undefined)try{localStorage.setItem('uptimeFullbayKey',o.key.trim());}catch(e){}
      if(o.auto!==undefined)try{localStorage.setItem('uptimeFullbayAuto',String(o.auto));}catch(e){}
    }
  });
});
</script>
</body>
</html>
